<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>部屋</title>
    <script src="room.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: #f4f4f4; padding: 10px; border-bottom: 1px solid #ddd; }
        main { padding: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 5px 0; border-bottom: 1px solid #f4f4f4; }
        input[type="text"], input[type="file"] { padding: 10px; margin-right: 10px; width: calc(100% - 110px); max-width: 300px; box-sizing: border-box; }
        button { padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header>
        <h1 id="roomTitle"></h1>
        <p id="roomDescription"></p>
    </header>
    <main>
        <ul id="messageList"></ul>
        <div>
            <input type="text" id="name" placeholder="名前">
            <input type="text" id="message" placeholder="メッセージ">
            <button id="sendButton">送信</button>
        </div>
        <div>
            <input type="file" id="fileUpload">
            <button id="uploadButton">ファイルをアップロード</button>
        </div>
    </main>
</body>
</html>
